{% extends 'base.html' %}

{% block title %}Logged Out - PayApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <!-- Logout confirmation card -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 class="card-title mb-0">Logged Out</h2>
            </div>
            <div class="card-body text-center">
                <h4 class="mb-4">You have been logged out successfully</h4>
                <p>Thank you for using PayApp!</p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary">Log In Again</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
